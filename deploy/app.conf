# 由平台在创建项目时生成 (backend=false, web=true, admin=false)
# 职责: 静态托管 web/admin, 反代 /api、/uploads 到 backend:8080
# 如需调整, 直接改本文件后重新构建即可 (docker compose build 会重新 COPY 进镜像)

client_max_body_size 500m;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_buffering off;
proxy_connect_timeout 30s;
proxy_send_timeout    60s;
proxy_read_timeout    300s;

gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml font/ttf font/otf;
gzip_vary on;

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Swarm/Docker DNS: 用 resolver + 变量让 proxy_pass 在请求时解析,
    # 避免 nginx 启动时 backend 服务 DNS 未就绪直接 [emerg] 退出
    # (host not found in upstream — 服务重启竞态, 曾导致 app 反复启动失败)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 静态文件缓存 (hash 文件名永久缓存)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 用户端 (web, base=./) — SPA history 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
